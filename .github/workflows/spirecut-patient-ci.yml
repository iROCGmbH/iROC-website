# CI for Spirecut DE/AT Patient Website
#
# BASE_PATH is set explicitly here so the vitest suite exercises the
# dynamic-injection path (process.env.BASE_PATH → __TEST_BASE_PATH__) rather
# than silently falling back to the hardcoded '/spirecut-patient' default.
#
# To change the deployment base in the future, update the single
# BASE_PATH value in the "env" block below. Both test steps read
# from that variable, so one edit is all that is needed.

name: Spirecut Patient CI

# GitHub branch protection is configured outside this repository. For each
# protected branch, require the "Unit tests from Spirecut Patient CI" status
# check before merging. The workflow and job names below are intentionally
# stable so that required check remains available.

on:
  push:
    paths:
      - 'artifacts/spirecut-patient/**'
      - 'lib/api-client-react/**'
      - 'lib/spirecut-shared/**'
      - '.github/workflows/spirecut-patient-ci.yml'

  pull_request:
    # This workflow's status check is required for protected branches. A
    # catch-all filter keeps GitHub from leaving that required check pending on
    # pull requests that do not otherwise touch a Spirecut path.
    paths:
      - '**'

env:
  # Single source of truth for the deployment base path.
  BASE_PATH: /spirecut-patient

jobs:
  test:
    name: Unit tests from Spirecut Patient CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check CI workflow path filters
        run: pnpm run check:ci-workflow-paths

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check GitHub Actions workflow syntax
        run: pnpm run check:ci-workflow-syntax

      # Primary test run: production base path.
      - name: Run vitest (BASE_PATH=${{ env.BASE_PATH }})
        working-directory: artifacts/spirecut-patient
        run: pnpm test

      # Staging-base smoke test: validates the dynamic injection path.
      - name: Run vitest with staging base path (BASE_PATH=/spirecut-patient-staging)
        working-directory: artifacts/spirecut-patient
        env:
          BASE_PATH: /spirecut-patient-staging
        run: BASE_PATH=/spirecut-patient-staging pnpm exec vitest run --config vitest.config.ts
