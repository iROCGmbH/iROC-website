openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: iROC GmbH website API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: customers
    description: Customer registration
  - name: orders
    description: Product orders
  - name: training
    description: Training registration and dates
  - name: auth
    description: Doctor login
  - name: doctors
    description: Trained doctors list
  - name: resources
    description: Doctor portal resources
  - name: admin
    description: Admin operations
  - name: team
    description: iROC team members
  - name: storage
    description: Object storage upload URLs
  - name: gemini
    description: Gemini AI chat and image operations
  - name: portal
    description: iROC customer/doctor self-service portal

paths:
  /patient-testimonials:
    get:
      operationId: listPatientTestimonials
      tags: [patients]
      summary: List published Spirecut patient video testimonials
      responses:
        "200":
          description: Published testimonials in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientTestimonial"

  /admin/patient-testimonials:
    get:
      operationId: listAdminPatientTestimonials
      tags: [admin]
      summary: List all patient video testimonials, including drafts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Testimonial list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientTestimonial"
    post:
      operationId: createPatientTestimonial
      tags: [admin]
      summary: Create a patient video testimonial
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientTestimonialInput"
      responses:
        "201":
          description: Testimonial created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientTestimonial"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/patient-testimonials/{id}:
    patch:
      operationId: updatePatientTestimonial
      tags: [admin]
      summary: Update any testimonial fields
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientTestimonialPatch"
      responses:
        "200":
          description: Testimonial updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientTestimonial"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Testimonial not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePatientTestimonial
      tags: [admin]
      summary: Delete a patient video testimonial
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Testimonial deleted
        "404":
          description: Testimonial not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List all team members
      responses:
        "200":
          description: Team member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"

  /admin/team:
    post:
      operationId: createTeamMember
      tags: [team, admin]
      summary: Create a new team member (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"

  /admin/team/{id}:
    patch:
      operationId: updateTeamMember
      tags: [team, admin]
      summary: Update a team member (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
    delete:
      operationId: deleteTeamMember
      tags: [team, admin]
      summary: Delete a team member (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned GCS upload URL (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /certified-doctors:
    get:
      operationId: listCertifiedDoctors
      tags: [doctors]
      summary: Public list of certified doctors for the treating-doctor dropdown
      parameters:
        - in: query
          name: instrument
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter to doctors certified for these instrument/product groups. If omitted, all doctors are returned.
      responses:
        "200":
          description: List of certified doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertifiedDoctorItem"

  /customers/register:
    post:
      operationId: registerCustomer
      tags: [customers]
      summary: Register a new customer and send email to iROC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegistrationInput"
      responses:
        "201":
          description: Customer registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    post:
      operationId: submitOrder
      tags: [orders]
      summary: Submit a product order (new or existing customer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /training/dates:
    get:
      operationId: getTrainingDates
      tags: [training]
      summary: Get all upcoming training dates
      responses:
        "200":
          description: List of training dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingDate"

  /training/register:
    post:
      operationId: registerForTraining
      tags: [training]
      summary: Register a doctor for a training session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingRegistrationInput"
      responses:
        "201":
          description: Training registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: doctorLogin
      tags: [auth]
      summary: Doctor login with provided password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: doctorLogout
      tags: [auth]
      summary: Doctor logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session info
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /doctors:
    get:
      operationId: listTrainedDoctors
      tags: [doctors]
      summary: Get list of trained doctors
      parameters:
        - name: instrument
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of trained doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainedDoctor"

  /geocode-postal:
    get:
      operationId: geocodePostal
      tags: [doctors]
      summary: Geocode a postal code for nearby-doctor searches
      parameters:
        - name: postal
          in: query
          required: true
          schema:
            type: string
        - name: country
          in: query
          required: true
          schema:
            type: string
          description: Country name or ISO alpha-2 code
      responses:
        "200":
          description: Postal-code coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoCoordinates"
        "400":
          description: Invalid postal code or country
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Postal code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: Get doctor portal resources (requires authentication)
      parameters:
        - name: instrument
          in: query
          required: false
          schema:
            type: string
            enum: [spirecut, ministem]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [presentation, study, video, link]
      responses:
        "200":
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/training-dates:
    post:
      operationId: createTrainingDate
      tags: [admin]
      summary: Admin - create a training date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingDateInput"
      responses:
        "201":
          description: Training date created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingDate"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/training-dates/{id}:
    delete:
      operationId: deleteTrainingDate
      tags: [admin]
      summary: Admin - delete a training date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Training date deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/doctors:
    post:
      operationId: createTrainedDoctor
      tags: [admin]
      summary: Admin - add a trained doctor to the public list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainedDoctorInput"
      responses:
        "201":
          description: Doctor added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainedDoctor"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/doctors/{id}:
    patch:
      operationId: updateTrainedDoctor
      tags: [admin]
      summary: Admin - update a trained doctor's full record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainedDoctorInput"
      responses:
        "200":
          description: Doctor updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainedDoctor"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTrainedDoctor
      tags: [admin]
      summary: Admin - remove a trained doctor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Doctor removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/training-registrations:
    get:
      operationId: listTrainingRegistrations
      tags: [admin]
      summary: Admin - list all training registrations
      responses:
        "200":
          description: List of training registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingRegistration"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/training-registrations/{id}/certify:
    post:
      operationId: certifyTrainingRegistration
      tags: [admin]
      summary: Admin - promote a training registrant to the certified doctors list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertifyRegistrationInput"
      responses:
        "201":
          description: Doctor certified and added to the public list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainedDoctor"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/training-registrations/{id}/confirm:
    post:
      operationId: confirmTrainingRegistration
      tags: [admin]
      summary: Admin - confirm a training registration and synchronize its lead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration confirmed and lead synchronized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmTrainingRegistrationResponse"
        "400":
          description: Invalid registration ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Registration cannot be confirmed from its current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Registration is missing required synchronization data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/resources:
    post:
      operationId: createResource
      tags: [admin]
      summary: Admin - add a resource to the doctor portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/resources/{id}:
    delete:
      operationId: deleteResource
      tags: [admin]
      summary: Admin - remove a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── iROC App: Auth ───────────────────────────────────────────────────────────
  /iroc/login:
    post:
      operationId: irocLogin
      tags: [iroc-auth]
      summary: Log in to the iROC inventory app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IrocLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrocLoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /iroc/me:
    get:
      operationId: getIrocMe
      tags: [iroc-auth]
      summary: Get current iROC app session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrocSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateIrocMe
      tags: [iroc-auth]
      summary: Update the current iROC app username
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIrocSessionInput"
      responses:
        "200":
          description: Updated session with replacement token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateIrocSessionResponse"
        "400":
          description: Invalid username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /iroc/password:
    patch:
      operationId: changeIrocPassword
      tags: [iroc-auth]
      summary: Change the current iROC app password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeIrocPasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeIrocPasswordResponse"
        "400":
          description: Invalid password data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Current password is incorrect or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── iROC App: Dashboard ───────────────────────────────────────────────────────
  /iroc/dashboard:
    get:
      operationId: getIrocDashboard
      tags: [iroc-dashboard]
      summary: Get dashboard summary stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDashboard"

  # ── iROC App: Customers ───────────────────────────────────────────────────────
  /iroc/customers:
    get:
      operationId: listIrocCustomers
      tags: [iroc-customers]
      summary: List all customers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppCustomer"
    post:
      operationId: createIrocCustomer
      tags: [iroc-customers]
      summary: Create a customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppCustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCustomer"

  /iroc/customers/{id}:
    get:
      operationId: getIrocCustomer
      tags: [iroc-customers]
      summary: Get a customer by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCustomer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateIrocCustomer
      tags: [iroc-customers]
      summary: Update a customer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppCustomerInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCustomer"
    delete:
      operationId: deleteIrocCustomer
      tags: [iroc-customers]
      summary: Delete a customer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── iROC App: Product groups ─────────────────────────────────────────────────
  /iroc/product-groups:
    get:
      operationId: listIrocProductGroups
      tags: [iroc-products]
      summary: List product groups
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppProductGroup"
    post:
      operationId: createIrocProductGroup
      tags: [iroc-products]
      summary: Create a product group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
