components:
  schemas:
    PatientTestimonial:
      type: object
      required: [id, titleDe, titleEn, descriptionDe, descriptionEn, patientLabel, procedureDe, procedureEn, videoUrl, displayOrder, published, createdAt, updatedAt]
      properties:
        id:
          type: integer
        titleDe:
          type: string
        titleEn:
          type: string
        descriptionDe:
          type: string
        descriptionEn:
          type: string
        patientLabel:
          type: string
        procedureDe:
          type: string
        procedureEn:
          type: string
        videoUrl:
          type: string
        displayOrder:
          type: integer
        published:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    PatientTestimonialInput:
      type: object
      required: [titleDe, titleEn, videoUrl]
      properties:
        titleDe:
          type: string
        titleEn:
          type: string
        descriptionDe:
          type: string
        descriptionEn:
          type: string
        patientLabel:
          type: string
        procedureDe:
          type: string
        procedureEn:
          type: string
        videoUrl:
          type: string
        displayOrder:
          type: integer
          minimum: 0
        published:
          type: boolean

    PatientTestimonialPatch:
      type: object
      minProperties: 1
      properties:
        titleDe:
          type: string
        titleEn:
          type: string
        descriptionDe:
          type: string
        descriptionEn:
          type: string
        patientLabel:
          type: string
        procedureDe:
          type: string
        procedureEn:
          type: string
        videoUrl:
          type: string
        displayOrder:
          type: integer
          minimum: 0
        published:
          type: boolean

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CertifiedDoctorItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          description: "Title and last name, e.g. Dr. Müller"
        institutionName:
          type: string
          nullable: true
          description: "Associated clinic or institute, when available"

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    CustomerRegistrationInput:
      type: object
      required:
        - address
        - postalCode
        - city
        - country
        - phone
        - email
        - instrument
        - privacyConsent
      properties:
        salutation:
          type: string
        title:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        specialty:
          type: ["string", "null"]
        institutionName:
          type: ["string", "null"]
        institutionType:
          type: ["string", "null"]
        address:
          type: string
        postalCode:
          type: string
        city:
          type: string
        country:
          type: string
        phone:
          type: string
        fax:
          type: ["string", "null"]
        email:
          type: string
        website:
          type: ["string", "null"]
        referenceNumber:
          type: ["string", "null"]
        ustIdNr:
          type: ["string", "null"]
        instrument:
          type: string
          enum: [spirecut, ministem, both, post_training_support, practice_marketing_support]
