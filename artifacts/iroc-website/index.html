            "text": "Das Karpal-Tunnel-Syndrom (KTS, CTS, carpal tunnel syndrome) ist eine Einengung des Nervus medianus im Handgelenk, die Handschmerzen, Taubheitsgefühle und Kraftverlust verursacht. Spirecut® behandelt KTS/CTS ultraschallgesteuert und minimalinvasiv – ohne Hautinzision, mit sofortiger Rückkehr zur Aktivität."

            "@type": "Answer",
            "text": "Trigger Finger (Schnappfinger, TF, SF) ist eine Erkrankung der Beugesehnen der Hand, bei der sich der Finger verhakt oder einrastet. Das Spirecut® Trigger Finger Sono-Instrument behandelt diesen Zustand ultraschallgesteuert ohne offene Schnittführung und ermöglicht eine schnelle Genesung."
          }
        },
